name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Playwright e2e is left out: it needs all three services running.
      - name: Unit tests
        run: npm test
